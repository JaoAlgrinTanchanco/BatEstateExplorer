<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Direct Agents | BatEstateExplorer</title>
  <link rel="stylesheet" href="admin_dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />
  <style>
    .sort-by {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sort-by label {
      font-weight: 500;
      color: #555;
    }
    .sort-by select {
      padding: 7px 15px;
      border-radius: 20px;
      border: 1px solid #dcdfe3;
      font-size: 0.95rem;
      background: #fff;
      width: 160px;
    }
    .direct-agents-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .sort-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 30px;
    }
    .sort-by {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .direct-agent-list {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }
    .direct-agent-card {
      display: flex;
      align-items: center;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 20px 30px;
      gap: 25px;
      border: 1px solid #e7e7e7;
    }
    .direct-agent-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #888;
    }
    .direct-agent-info {
      flex: 1;
    }
    .direct-agent-info .direct-agent-name {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }
    .direct-agent-info .direct-agent-location {
      color: #888;
      font-size: 0.97rem;
    }
    .direct-agent-actions {
      display: flex;
      gap: 10px;
    }
    .direct-agent-actions button {
      padding: 8px 18px;
      border-radius: 20px;
      border: none;
      font-weight: 500;
      font-size: 0.97rem;
      cursor: pointer;
      background: #f4f7fa;
      color: #222;
      transition: background 0.2s, color 0.2s;
    }
    .direct-agent-actions button:hover {
      background: #000;
      color: #fff;
    }
    .direct-agent-actions .remove-btn {
      background: #fff0f0;
      color: #c00;
      border: 1px solid #f5c2c2;
    }
    .direct-agent-actions .remove-btn:hover {
      background: #c00;
      color: #fff;
      border: 1px solid #c00;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">BatEstateExplorer</div>
        <h3>Hi, Admin!</h3>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li><a href="admin_dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
          <li class="nav-dropdown open">
            <a href="#" class="dropdown-toggle"><i class="fa-solid fa-users"></i> Manage Accounts <i class="fa-solid fa-chevron-down dropdown-icon"></i></a>
            <ul class="dropdown-menu">
              <li><a href="admin_direct_agents.html">Direct Agents</a></li>
              <li><a href="admin_associate_agents.html">Associate Agent</a></li>
            </ul>
          </li>
          <li><a href="admin_property_listings.html"><i class="fa-solid fa-house-chimney"></i> Property Listings</a></li>
          <li><a href="admin_applications.html"><i class="fa-solid fa-file-lines"></i> Applications</a></li>
          <li><a href="#"><i class="fa-solid fa-flag"></i> Reports</a></li>
          <li><a href="admin_performance.html"><i class="fa-solid fa-chart-bar"></i> Performance</a></li>
        </ul>
      </nav>
    </aside>
    <!-- Main Content -->
    <main class="main-content">
      <header class="main-header direct-agents-header">
        <h1>Direct Agents</h1>
        <div class="header-actions">
          
          <button class="logout-btn">Log Out</button>
          <div class="profile-btn">
            <i class="fa-solid fa-user"></i>
          </div>
        </div>
      </header>
      <div class="sort-row">
        <div class="sort-by">
          <label for="sort">Sort By:</label>
          <select id="sort">
            <option value="name">Name</option>
            <option value="location">Location</option>
            <option value="newest">Newest</option>
          </select>
        </div>
      </div>
      <div class="direct-agent-list" id="directAgentList">
        <div class="direct-agent-card" data-name="Nicole Ratumbakal" data-location="Lemery" data-id="1">
          <div class="direct-agent-avatar"><i class="fa-solid fa-user"></i></div>
          <div class="direct-agent-info">
            <div class="direct-agent-name">Nicole Ratumbakal</div>
            <div class="direct-agent-location">Lemery</div>
          </div>
          <div class="direct-agent-actions">
            <button>View Details</button>
            <button>Message</button>
            <button class="remove-btn">Remove Account</button>
          </div>
        </div>
        <div class="direct-agent-card" data-name="Leiron Millarez" data-location="Lipa" data-id="2">
          <div class="direct-agent-avatar"><i class="fa-solid fa-user"></i></div>
          <div class="direct-agent-info">
            <div class="direct-agent-name">Leiron Millarez</div>
            <div class="direct-agent-location">Lipa</div>
          </div>
          <div class="direct-agent-actions">
            <button>View Details</button>
            <button>Message</button>
            <button class="remove-btn">Remove Account</button>
          </div>
        </div>
        <div class="direct-agent-card" data-name="Nancy Bagasc" data-location="Batangas City" data-id="3">
          <div class="direct-agent-avatar"><i class="fa-solid fa-user"></i></div>
          <div class="direct-agent-info">
            <div class="direct-agent-name">Nancy Bagasc</div>
            <div class="direct-agent-location">Batangas City</div>
          </div>
          <div class="direct-agent-actions">
            <button>View Details</button>
            <button>Message</button>
            <button class="remove-btn">Remove Account</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script>
    // Sidebar navigation interactivity
    document.querySelectorAll('.sidebar-nav a').forEach(link => {
      link.addEventListener('click', function(e) {
        if (!this.classList.contains('dropdown-toggle')) {
          document.querySelectorAll('.sidebar-nav a').forEach(l => l.classList.remove('active'));
          this.classList.add('active');
        }
      });
    });
    // Dropdown toggle
    document.querySelectorAll('.dropdown-toggle').forEach(toggle => {
      toggle.addEventListener('click', function(e) {
        e.preventDefault();
        this.parentElement.classList.toggle('open');
      });
    });
    // Sort By Dropdown interactivity
    const sortSelect = document.getElementById('sort');
    const directAgentList = document.getElementById('directAgentList');
    function sortDirectAgents(criteria) {
      const cards = Array.from(directAgentList.querySelectorAll('.direct-agent-card'));
      let sorted;
      if (criteria === 'name') {
        sorted = cards.sort((a, b) => a.dataset.name.localeCompare(b.dataset.name));
      } else if (criteria === 'location') {
        sorted = cards.sort((a, b) => a.dataset.location.localeCompare(b.dataset.location));
      } else if (criteria === 'newest') {
        sorted = cards.sort((a, b) => b.dataset.id - a.dataset.id);
      }
      sorted.forEach(card => directAgentList.appendChild(card));
    }
    sortSelect.addEventListener('change', function() {
      sortDirectAgents(this.value);
    });
  </script>
</body>
</html>
