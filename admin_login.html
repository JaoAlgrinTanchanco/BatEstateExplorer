<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | BatEstateExplorer</title>
  <link rel="stylesheet" href="/homepage.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen;
      position: relative; /* Required for the pseudo-element */
      overflow: hidden; /* Ensures the blurred edges don't spill */
    }

    body::before {
        content: '';
        position: absolute;
        top: -10px; left: -10px; /* Extend to hide blurred edges */
        right: -10px; bottom: -10px;
        background: url('Pictures/bg4.jpg') center/cover no-repeat;
        filter: blur(8px) grayscale(40%); /* Apply blur and a grayish tint */
        z-index: -1; /* Position it behind the content */
    }

    .login-card {
      max-width: 420px;
      width: 100%;
      /* Override from homepage.css to work with the new background */
      background: rgba(255, 255, 255, 0.85); /* Adjust opacity if needed */
      backdrop-filter: none; /* Remove the backdrop blur which is now redundant */
    }
    
    .card-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        margin-bottom: 20px;
    }

    .logo-placeholder {
        font-weight: bold;
        color: #333;
        padding: 10px 15px;
        border: 2px solid #eee;
        border-radius: 8px;
        background: #f9f9f9;
        font-size: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 50px;
        height: 50px;
    }

    .header-title {
        font-size: 1.25rem;
        font-weight: 600;
        color: #333;
    }
    
    .form-title {
        text-align: center;
        font-size: 1.75rem;
        font-weight: 600;
        margin-bottom: 25px;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }
    
    .input-group .rounded-input {
        width: 100%;
        padding-right: 45px;
    }

    .input-group .toggle-password {
      position: absolute;
      top: 50%;
      right: 18px;
      transform: translateY(-50%);
      cursor: pointer;
      color: #999;
    }
    
    .login-button {
        width: 100%;
    }

    .forgot-password-link {
        display: block; 
        text-align: right; 
        margin-top: -10px; 
        margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="auth-card login-card">
    <div class="card-header">
        <div class="logo-placeholder"><i class="fa-solid fa-building"></i></div>
        <span class="header-title">Welcome Back, Admin!</span>
    </div>

    <h2 class="form-title">Login</h2>

    <form id="adminLoginForm" novalidate>
      <div class="input-group">
        <input type="text" id="emailOrPhone" class="rounded-input" placeholder="Email or Phone number" required>
      </div>
      <div class="input-group">
        <input type="password" id="password" class="rounded-input" placeholder="Password" required>
        <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
      </div>
      <a href="#" class="auth-link forgot-password-link">Forgot Password?</a>
      <button type="submit" class="btn login-button">Login</button>
    </form>
  </div>

  <script>
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    if (togglePassword && passwordInput) {
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    }

    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const emailOrPhone = document.getElementById('emailOrPhone').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = this.querySelector('button[type="submit"]');
      const originalText = submitBtn.textContent;
      
      // Basic validation
      if (!emailOrPhone) {
        alert('Please enter your email or phone number.');
        document.getElementById('emailOrPhone').focus();
        return;
      }
      
      if (!password) {
        alert('Please enter your password.');
        document.getElementById('password').focus();
        return;
      }
      
      // Show loading state
      submitBtn.textContent = 'Logging in...';
      submitBtn.disabled = true;
      
      // Simulate authentication (replace with actual backend integration)
      setTimeout(() => {
        // For demo purposes, accept any non-empty credentials
        if (emailOrPhone && password) {
          // Success - redirect to admin dashboard
          submitBtn.textContent = 'Success!';
          submitBtn.style.background = '#1a7f1a';
          
          setTimeout(() => {
            window.location.href = 'admin_dashboard.html';
          }, 1000);
        } else {
          // Failed login
          alert('Invalid credentials. Please try again.');
          submitBtn.textContent = originalText;
          submitBtn.disabled = false;
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      }, 1500); // Simulate network delay
    });
  </script>

</body>
</html>
