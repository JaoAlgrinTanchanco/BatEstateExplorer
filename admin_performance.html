<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance | BatEstateExplorer</title>
  <link rel="stylesheet" href="admin_dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .performance-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .performance-graph-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 400px;
      margin-top: 40px;
    }
    .bar-graph {
      display: flex;
      align-items: flex-end;
      gap: 40px;
      height: 260px;
      margin-bottom: 30px;
    }
    .bar {
      width: 40px;
      background: #222;
      border-radius: 8px 8px 0 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transition: background 0.2s;
    }
    .bar-label {
      text-align: center;
      margin-top: 8px;
      font-size: 1rem;
      color: #333;
    }
    .performance-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0;
    }
    .metrics-summary {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 30px;
      margin-top: 10px;
    }
    .metric-box {
      background: #f4f7fa;
      border-radius: 12px;
      padding: 18px 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      text-align: center;
      border: 1px solid #e7e7e7;
      min-width: 180px;
    }
    .metric-title {
      font-size: 1.05rem;
      color: #888;
      margin-bottom: 6px;
    }
    .metric-value {
      font-size: 1.7rem;
      font-weight: 600;
      color: #222;
    }
    .metric-highlight {
      color: #1a7f1a;
      font-weight: 700;
    }
    .metric-danger {
      color: #c00;
      font-weight: 700;
    }
    .metric-property {
      color: #0074d9;
      font-weight: 700;
    }
    .chart-container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px 24px 24px;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">BatEstateExplorer</div>
        <h3>Hi, Admin!</h3>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li><a href="admin_dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
          <li class="nav-dropdown">
            <a href="#" class="dropdown-toggle"><i class="fa-solid fa-users"></i> Manage Accounts <i class="fa-solid fa-chevron-down dropdown-icon"></i></a>
            <ul class="dropdown-menu">
              <li><a href="admin_direct_agents.html">Direct Agents</a></li>
              <li><a href="admin_associate_agents.html">Associate Agents</a></li>
            </ul>
          </li>
          <li><a href="admin_property_listings.html"><i class="fa-solid fa-house-chimney"></i> Property Listings</a></li>
          <li><a href="admin_applications.html"><i class="fa-solid fa-file-lines"></i> Applications</a></li>
          <li><a href="admin_reports.html"><i class="fa-solid fa-flag"></i> Reports</a></li>
          <li><a href="admin_performance.html" class="active"><i class="fa-solid fa-chart-bar"></i> Performance</a></li>
        </ul>
      </nav>
    </aside>
    <!-- Main Content -->
    <main class="main-content">
      <header class="main-header performance-header">
        <h1 class="performance-title">Performance</h1>
        <div class="header-actions">
          <button class="logout-btn">Log Out</button>
          <div class="profile-btn">
            <i class="fa-solid fa-user"></i>
          </div>
        </div>
      </header>
      <div class="performance-graph-container">
        <div class="metrics-summary">
          <div class="metric-box">
            <div class="metric-title">Most Selling Property</div>
            <div class="metric-value metric-property">Sunrise Villa</div>
          </div>
          <div class="metric-box">
            <div class="metric-title">Top Performing Agent</div>
            <div class="metric-value metric-highlight">Agent 4</div>
          </div>
        </div>
        <div class="chart-container">
          <canvas id="performanceChart" height="260"></canvas>
        </div>
        <div style="margin-top: 48px; width: 100%; max-width: 700px;">
          <h2 style="font-size: 1.2rem; font-weight: 600; color: #222; margin-bottom: 18px;">Most Selling Properties</h2>
          <div class="chart-container">
            <canvas id="propertyChart" height="260"></canvas>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script>
    // Chart.js interactive bar chart
    const ctx = document.getElementById('performanceChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Agent 1', 'Agent 2', 'Agent 3', 'Agent 4', 'Agent 5'],
        datasets: [{
          label: 'Properties Sold',
          data: [14, 9, 18, 22, 6],
          backgroundColor: [
            '#bbb', '#bbb', '#bbb', '#1a7f1a', '#bbb' // Agent 4 is green, rest are grey
          ],
          borderRadius: 8,
          hoverBackgroundColor: [
            '#888', '#888', '#888', '#2ecc40', '#888'
          ]
        }]
      },
      options: {
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(context) {
                return `Properties Sold: ${context.parsed.y}`;
              }
            }
          }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: { color: '#333', font: { size: 14 } },
            title: {
              display: true,
              text: 'Agents',
              color: '#333',
              font: { size: 16, weight: 'bold' },
              padding: { top: 12 }
            }
          },
          y: {
            beginAtZero: true,
            grid: { color: '#eee' },
            ticks: { color: '#888', font: { size: 13 } },
            title: {
              display: true,
              text: 'Properties Sold',
              color: '#333',
              font: { size: 16, weight: 'bold' },
              padding: { bottom: 12 }
            }
          }
        }
      }
    });
    // Most Selling Properties Chart
    const ctx2 = document.getElementById('propertyChart').getContext('2d');
    new Chart(ctx2, {
      type: 'bar',
      data: {
        labels: ['Sunrise Villa', 'Greenfield Lot', 'Skyline Condo', 'Lakeside House', 'Hilltop Estate'],
        datasets: [{
          label: 'Units Sold',
          data: [22, 15, 18, 12, 9],
          backgroundColor: [
            '#0074d9', '#bbb', '#bbb', '#bbb', '#bbb' // Sunrise Villa is blue, rest are grey
          ],
          borderRadius: 8,
          hoverBackgroundColor: [
            '#339af0', '#888', '#888', '#888', '#888'
          ]
        }]
      },
      options: {
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(context) {
                return `Units Sold: ${context.parsed.y}`;
              }
            }
          }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: { color: '#333', font: { size: 14 } },
            title: {
              display: true,
              text: 'Properties',
              color: '#333',
              font: { size: 16, weight: 'bold' },
              padding: { top: 12 }
            }
          },
          y: {
            beginAtZero: true,
            grid: { color: '#eee' },
            ticks: { color: '#888', font: { size: 13 } },
            title: {
              display: true,
              text: 'Units Sold',
              color: '#333',
              font: { size: 16, weight: 'bold' },
              padding: { bottom: 12 }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
